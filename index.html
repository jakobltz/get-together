<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get-Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Eine zentrierte Einladungskarte, Formular darunter, alles auf einer Handyhoehe. */
:root{
  --paper:#f6f6f3; --card:#ffffff; --ink:#17201b; --muted:#5f6b63;
  --line:#e0e1db; --accent:#9a6b2f; --yes:#2f6b47; --no:#8c3a32;
  --shadow:0 1px 2px rgba(23,32,27,.05), 0 8px 24px rgba(23,32,27,.06);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101410; --card:#171d18; --ink:#e9ebe6; --muted:#98a199;
    --line:#2a312c; --accent:#c9954e; --yes:#56a271; --no:#cc7066;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101410; --card:#171d18; --ink:#e9ebe6; --muted:#98a199;
  --line:#2a312c; --accent:#c9954e; --yes:#56a271; --no:#cc7066;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center;
  padding-block:clamp(24px,6vh,64px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet{width:100%; max-width:460px; display:flex; flex-direction:column; gap:22px}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:26px 22px;
}
.eyebrow{
  font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:600; margin:0 0 10px;
}
h1{
  font-family:var(--display); font-weight:600; font-size:30px; line-height:1.15;
  margin:0 0 16px; text-wrap:balance;
}
dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 16px; font-size:15px}
dt{color:var(--muted)}
dd{margin:0; font-weight:500}

label{display:block; font-weight:600; font-size:14px; margin:0 0 8px}
.field{margin-bottom:20px}
.field:last-of-type{margin-bottom:0}
input[type=text],textarea{
  width:100%; font:inherit; color:var(--ink); background:var(--paper);
  border:1px solid var(--line); border-radius:10px; padding:12px 13px;
}
textarea{resize:vertical; min-height:70px}
input:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.hint{font-size:13px; color:var(--muted); margin:7px 0 0}

.choice{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.choice button{
  font:inherit; font-weight:600; cursor:pointer; padding:15px 10px;
  border-radius:10px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); transition:border-color .15s, background .15s;
}
.choice button[aria-pressed=true]{border-color:var(--yes); background:color-mix(in srgb, var(--yes) 12%, transparent); color:var(--yes)}
.choice button[data-v=no][aria-pressed=true]{border-color:var(--no); background:color-mix(in srgb, var(--no) 12%, transparent); color:var(--no)}

.counter{display:flex; gap:8px; flex-wrap:wrap}
.counter button{
  font:inherit; font-weight:600; cursor:pointer; min-width:52px; padding:11px 0;
  border-radius:10px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
}
.counter button[aria-pressed=true]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent)}

.send{
  width:100%; font:inherit; font-weight:600; font-size:16px; cursor:pointer;
  padding:15px; border-radius:10px; border:0; background:var(--ink); color:var(--paper);
}
.send:disabled{opacity:.4; cursor:not-allowed}
.error{color:var(--no); font-size:14px; margin:12px 0 0}
.done h2{font-family:var(--display); font-weight:600; font-size:24px; margin:0 0 8px}
.done p{margin:0; color:var(--muted)}
.foot{text-align:center; font-size:13px; color:var(--muted); margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="sheet">
  <section class="card">
    <p class="eyebrow" id="ev-city">Einladung</p>
    <h1 id="ev-title">Get-Together in Köln</h1>
    <dl>
      <dt>Wann</dt><dd id="ev-when">…</dd>
      <dt>Wo</dt><dd id="ev-where">…</dd>
    </dl>
  </section>

  <form class="card" id="form">
    <div class="field">
      <label for="name">Dein Name</label>
      <input type="text" id="name" autocomplete="name" placeholder="Vor- und Nachname" required>
    </div>

    <div class="field">
      <label id="lbl-att">Kommst du?</label>
      <div class="choice" role="group" aria-labelledby="lbl-att">
        <button type="button" id="yes" data-v="yes" aria-pressed="false">Bin dabei</button>
        <button type="button" id="no" data-v="no" aria-pressed="false">Kann nicht</button>
      </div>
    </div>

    <div class="field" id="guests-field" hidden>
      <label id="lbl-g">Bringst du jemanden mit?</label>
      <div class="counter" role="group" aria-labelledby="lbl-g" id="counter"></div>
    </div>

    <div class="field">
      <label for="note">Noch etwas? <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea id="note" maxlength="300" placeholder="Komme später, esse vegetarisch, …"></textarea>
    </div>

    <p class="error" id="err" hidden></p>
    <div style="margin-top:22px"><button class="send" id="send" type="submit" disabled>Antwort senden</button></div>
  </form>

  <section class="card done" id="done" hidden>
    <h2 id="done-h">Danke!</h2>
    <p id="done-p"></p>
  </section>

  <p class="foot" id="foot"></p>
</main>

<script>
(function(){
  var URL_ = "https://iagfuoglkzvchpohmuiz.supabase.co";
  var KEY  = "sb_publishable_yDAAnLJPqVwveJFVv-aYtw_l2XNI9OS";

  var EVENTS = {
    koeln: {
      city:"Einladung", title:"Get-Together in Köln",
      when:"Freitag, 23. Oktober, 19:30 Uhr ankommen, Tisch ab 20:00 Uhr",
      where:"Gilden im Zims, Heumarkt 77, 50667 Köln",
      foot:"Sag bitte bis Mittwochabend Bescheid, dann kann ich die Reservierung noch anpassen."
    },
    frankfurt: {
      city:"Einladung", title:"Get-Together in Frankfurt",
      when:"Freitag, 30. Oktober, ab 19:30 Uhr",
      where:"Ort folgt",
      foot:"Sag bitte bis Mittwochabend Bescheid, dann kann ich die Reservierung noch anpassen."
    }
  };

  var key = (new URLSearchParams(location.search).get("e") || "koeln").toLowerCase();
  var ev = EVENTS[key] || EVENTS.koeln;
  if(!EVENTS[key]) key = "koeln";

  document.getElementById("ev-city").textContent  = ev.city;
  document.getElementById("ev-title").textContent = ev.title;
  document.getElementById("ev-when").textContent  = ev.when;
  document.getElementById("ev-where").textContent = ev.where;
  document.getElementById("foot").textContent     = ev.foot;
  document.title = ev.title;

  var attending = null, guests = 0;
  var nameEl = document.getElementById("name");
  var yesB = document.getElementById("yes"), noB = document.getElementById("no");
  var gField = document.getElementById("guests-field"), counter = document.getElementById("counter");
  var sendB = document.getElementById("send"), errEl = document.getElementById("err");
  var form = document.getElementById("form"), done = document.getElementById("done");

  [0,1,2,3].forEach(function(n){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = n === 0 ? "Nur ich" : "+" + n;
    b.setAttribute("aria-pressed", n === 0 ? "true" : "false");
    b.addEventListener("click", function(){
      guests = n;
      Array.prototype.forEach.call(counter.children, function(c){ c.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
    });
    counter.appendChild(b);
  });

  function refresh(){
    sendB.disabled = !(nameEl.value.trim().length > 0 && attending !== null);
  }
  function pick(v){
    attending = v;
    yesB.setAttribute("aria-pressed", v ? "true" : "false");
    noB.setAttribute("aria-pressed", v ? "false" : "true");
    gField.hidden = !v;
    if(!v) guests = 0;
    refresh();
  }
  yesB.addEventListener("click", function(){ pick(true); });
  noB.addEventListener("click", function(){ pick(false); });
  nameEl.addEventListener("input", refresh);

  form.addEventListener("submit", function(e){
    e.preventDefault();
    errEl.hidden = true;
    sendB.disabled = true;
    sendB.textContent = "Wird gesendet …";

    fetch(URL_ + "/rest/v1/rsvp", {
      method:"POST",
      headers:{
        "apikey": KEY,
        "Authorization": "Bearer " + KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        event_id: key,
        name: nameEl.value.trim().slice(0,80),
        attending: attending,
        guests: attending ? guests : 0,
        note: document.getElementById("note").value.trim().slice(0,300) || null
      })
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      var first = nameEl.value.trim().split(/\s+/)[0];
      document.getElementById("done-h").textContent = attending
        ? "Schön, bis dann!"
        : "Schade, danke dir.";
      document.getElementById("done-p").textContent = attending
        ? (first + ", du stehst auf der Liste" + (guests ? " (mit " + guests + (guests === 1 ? " Begleitung)" : " Begleitungen)") : "") + ". " + ev.when + ", " + ev.where + ".")
        : ("Danke für die Rückmeldung, " + first + ". Nächstes Mal.");
      form.hidden = true; done.hidden = false;
      done.scrollIntoView({behavior:"smooth", block:"nearest"});
    }).catch(function(){
      errEl.textContent = "Das hat nicht geklappt. Versuch es nochmal oder schreib Jakob direkt.";
      errEl.hidden = false;
      sendB.disabled = false;
      sendB.textContent = "Antwort senden";
    });
  });
})();
</script>
</body>
</html>
